[project]
name = "smaccl"
version = "1.0"
dependencies = [
    "numpy", 
    "xarray", 
    "pyopencl", 
    "h5py",
    "scipy",
#    "smac-neo @ git+https://github.com/hygeos/smac-neo.git"
    ]

[tool.poetry]
mane = "smaccl"
version = "1.0"
packages = [ {include = "smaccl"}]
[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pixi.tasks]
tests = "pytest tests/"

[tool.pixi.pypi-dependencies]
#smaccl = { path = ".", editable = true }
#smac-neo = { path = "/mnt/qnaphome/bruno/Projets/smac-neo", editable = true }

[tool.pixi.dependencies]
pytest = "*"
numpy = "*"
xarray = "*"
pyopencl = "*"
pocl = "*"
h5py = "*"
scipy = "*"
netcdf4 = "*"
h5netcdf = "*"
jax = '*'
dask = "*"
rasterio = '*'
ONNXRuntime = '*'
